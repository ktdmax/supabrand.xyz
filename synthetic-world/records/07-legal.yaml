- id: legal.warranty-wording-eu
  family: context
  kind: note
  domain: legal
  nature: knowledge
  state: defined
  authority: binding
  scope: {jurisdictions: [AT, DE, CH, FR, IT, ES, NL, PL, CZ, GB]}
  sourceRefs: ["synthetic:commercial-legal-warranty-guidance-2026"]
  value:
    rule: Consumer warranty statements in European markets reference the statutory warranty and the SUPABRAND two-year commercial frame warranty; the word lifetime is reserved for the US C11 placement. Commercial (B2B) warranties follow contract annex wording.
    note: Statutory consumer rights differ per jurisdiction and are never summarised in marketing copy; link to the market terms page.
  relatedTo: [claim.c11-us-c2-lifetime-frame-warranty, claim.c10-f4-frame-warranty]

- id: legal.road-use-review
  family: context
  kind: note
  domain: legal
  nature: knowledge
  state: defined
  authority: binding
  scope: {productFamilies: [glide]}
  sourceRefs: ["supabrand:sources/12-pico-consumer-guide.md", "supabrand:sources/07-product-naming-and-market-release.md"]
  value:
    rule: Road-use statements for PICO G1 (where it may be ridden, licence, helmet, age) are market-specific and require Commercial Legal sign-off per market. Commercial release never implies public-road permission.
    ukNote: PICO G1 is not released in GB; never imply UK public-road permission.
    deNote: German consumer copy may state eKFV conformity only with the market-specific wording released by Commercial Legal for DE (synthetic).
  relatedTo: [product.pico-g1]

