- id: rules.no-partner-endorsement-wording
  family: rules
  kind: term-prohibition
  domain: legal
  nature: fact
  state: defined
  authority: binding
  sourceRefs: ["supabrand:sources/08-partnership-use-notes.md"]
  value:
    statement: Partner names are never combined with endorsement wording such as powered by, certified by or exclusive partner.
    obligation: prohibit
    enforcement: block
    validationMode: deterministic
    checks: [{primitive: term_prohibited, params: {terms: [powered by ORBITAL MESH, certified by ORBITAL MESH, exclusive partner of ORBITAL MESH, powered by VIAFORMA, VIAFORMA-certified], match: word_boundary_ci}}]
    condition: {}
    requirement: {}
    references: [legal.partner-grant.orbital-mesh, legal.partner-grant.viaforma]

