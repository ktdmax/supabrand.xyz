# SYNTHETIC TEST DATA. Sales enablement records. Programme terms are invented.
elements:
- id: sales.dealer-programme
  family: context
  kind: programme
  domain: sales
  nature: knowledge
  state: defined
  authority: binding
  scope: {audiences: [dealer]}
  sourceRefs: ["synthetic:dealer-programme-terms-2026"]
  validity: {from: "2026-01-01T00:00:00Z", to: null}
  value:
    name: SUPABRAND Partner Dealer Programme 2026
    tiers: [Partner, Partner Plus]
    requirements: Showroom display of at least two current models, SECOND MILE workshop participation or referral, use of released claim wording and qualifications.
    support: Range-release trade presentation, demo fleet conditions, co-funded local advertising within the campaign toolkit.
    coOpAdvertising: 50% co-funding of approved local media, capped per dealer per year (synthetic).

- id: sales.dealer-programme.at
  subject: sales.dealer-programme
  family: context
  kind: programme
  domain: sales
  nature: knowledge
  state: defined
  authority: binding
  scope: {audiences: [dealer], markets: [AT]}
  sourceRefs: ["synthetic:dealer-programme-terms-2026", "synthetic:at-sales-office-addendum-2026-03"]
  validity: {from: "2026-03-01T00:00:00Z", to: null}
  value:
    name: SUPABRAND Partner Dealer Programme 2026, Austria addendum
    tiers: [Partner, Partner Plus]
    requirements: As global, plus participation in the Vienna flagship demo days twice a year.
    support: As global; local co-funding includes regional print within the toolkit.
    coOpAdvertising: 60% co-funding for Partner Plus dealers in Austria (home-market addendum, synthetic).
  annotations: [{type: note, text: "Local override of the global programme for AT dealers; same subject, narrower scope."}]

- id: sales.fleet-enquiry-process
  family: context
  kind: process
  domain: sales
  nature: knowledge
  state: defined
  authority: binding
  scope: {productFamilies: [cargo, node], audiences: [fleet-operator, procurement, facilities-manager]}
  sourceRefs: ["supabrand:sources/13-professional-field-dockgrid.md", "synthetic:professional-systems-playbook-2026"]
  value:
    steps: [Enquiry via Professional Systems (no online checkout), Needs assessment and demo fleet (F4) or site survey (N6), Commercial proposal with contract annex and warranty terms, Pilot or rollout with Fleet Analytics reporting]
    rule: FIELD F4 and DOCKGRID N6 are never sold through consumer ecommerce or consumer dealers.
  relatedTo: [technical.n6-installation, project.sales-enablement-pro-2026]

- id: sales.objection-handling.city
  family: context
  kind: note
  domain: sales
  nature: knowledge
  state: defined
  authority: informational
  scope: {productFamilies: [city], audiences: [dealer]}
  sourceRefs: ["synthetic:sales-enablement-dealer-notes-2026"]
  value:
    price: Position City C2 on the frame warranty, SECOND MILE service access and the recycled-content frame (with qualification), not on discounts.
    range: City use rarely needs the full pack; point to removable battery and everyday charging rather than range numbers (no released City range claim exists).
    sustainability: Use only the C06 frame wording; never say the bicycle is 62% recycled or sustainable.
  relatedTo: [claim.c06-c2-frame-recycled, rules.no-recycled-bicycle-wording]

- id: sales.presentation-rules
  family: context
  kind: note
  domain: sales
  nature: knowledge
  state: defined
  authority: binding
  scope: {outputTypes: [sales-presentation]}
  sourceRefs: ["supabrand:sources/21-presentation-guidelines-2023.md", "supabrand:sources/13-professional-field-dockgrid.md"]
  value:
    structure: Title with masterbrand lockup, context, product facts, evidence with qualification on the same slide, next steps.
    claims: Every claim slide carries the qualification in body type; expired or draft claims are excluded.
    partners: Partner marks only within the grant (ORBITAL MESH in B2B presentations; never VIAFORMA).
    language: German B2B presentations use Sie.
  relatedTo: [legal.partner-grant.orbital-mesh, communication.address.b2b-de]
