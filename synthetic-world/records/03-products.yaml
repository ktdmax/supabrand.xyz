# SYNTHETIC TEST DATA. Product facts. Display names, positioning and market release follow the existing fixture (PN-263). Specifications are invented and are not real engineering data.
elements:
- id: product.naming-rules
  family: context
  kind: note
  domain: product
  nature: knowledge
  state: defined
  authority: binding
  sourceRefs: ["supabrand:sources/07-product-naming-and-market-release.md"]
  validity: {from: "2026-07-01T00:00:00Z", to: null}
  value:
    displayNames: [SUPABRAND City C1 DAILY, SUPABRAND City C2, SUPABRAND VELA A8, SUPABRAND FIELD F4, SUPABRAND PICO G1, SUPABRAND DOCKGRID N6]
    firstMention: Full display name at first product mention; later prose may omit SUPABRAND when ownership is clear on the same page. Technical part labels may use the SKU alone.
    capitals: Keep VELA, PICO, FIELD, DOCKGRID and DAILY in capitals in Latin-script copy; DAILY is never translated.
    forbiddenInventions: [SUPA Bike, PICO by VELA, VELA Pro, DOCKGRID Home]
    notes: DAILY is a line, not an endorsed brand. A8 and F4 are model identifiers, not ranges.
  relatedTo: [product.city-one-historical, product.vela-a8.display-name]

