# SYNTHETIC TEST DATA. Technical records. Specifications are invented fixture values, not engineering data.
elements:
- id: technical.f4-b2-battery
  family: context
  kind: fact-sheet
  domain: technical
  nature: fact
  state: defined
  authority: binding
  scope: {productFamilies: [cargo, node]}
  sourceRefs: ["supabrand:sources/13-professional-field-dockgrid.md", "synthetic:systems-engineering-spec-F4B2-rev3"]
  validity: {from: "2026-01-01T00:00:00Z", to: null}
  value:
    name: F4-B2 fleet battery pack
    nominalEnergy: 720 Wh (synthetic)
    chemistry: Lithium-ion NMC, 48 V nominal (synthetic)
    compatibility: FIELD F4 (all 26.3 configurations); DOCKGRID N6 bays accept approved F4-B2 packs only
    swap: Tool-free swap; packs are serialised and registered to the operator fleet account
    transport: Shipped as UN3480-class goods under the operator's logistics contract (synthetic)
  caveats: ["No consumer product uses the F4-B2 pack. Do not describe N6 as universal charging."]
  relatedTo: [product.field-f4, product.dockgrid-n6]

- id: technical.n6-installation
  family: context
  kind: note
  domain: technical
  nature: knowledge
  state: defined
  authority: binding
  scope: {productFamilies: [node], audiences: [facilities-manager, installation-partner, fleet-operator]}
  sourceRefs: ["supabrand:sources/13-professional-field-dockgrid.md", "synthetic:dockgrid-installation-handbook-2026"]
  value:
    steps: [Site survey by a SUPABRAND-approved installation partner, Configuration record (power, bay count, ventilation, fire-safety zone), Commissioning with 3-phase supply and remote monitoring, Operator training and handover protocol]
    constraints: Indoor or covered placement; ambient 0–40 °C during charging; no public access to bays without the operator's access control.
    orderRule: An N6 order is confirmed only after the installation survey and configuration record exist.
  relatedTo: [product.dockgrid-n6, claim.c09-n6-six-batteries]

- id: technical.assist-configurations
  family: context
  kind: note
  domain: technical
  nature: knowledge
  state: defined
  authority: binding
  scope: {productFamilies: [city, allroad]}
  sourceRefs: ["synthetic:vehicle-validation-config-matrix-2026"]
  value:
    euChUk: Pedal assist cut-off 25 km/h, 250 W continuous rated motor.
    us: Class 1 configuration, assist cut-off 20 mph; separate homologation and labelling.
    kr: Korean configuration with local labelling; assist cut-off 25 km/h.
    rule: Performance statements that cite a configuration (range, assist speed) apply only to that configuration. Range claim C07 covers the EU/CH/UK configuration.
  relatedTo: [claim.c07-a8-range]

- id: technical.web-qualification-rendering
  family: context
  kind: note
  domain: technical
  nature: knowledge
  state: defined
  authority: binding
  scope: {channels: [web, ecommerce]}
  sourceRefs: ["supabrand:sources/04-digital-design-system.md"]
  value:
    qualifierText: Claim qualifications render at a minimum of 12 CSS px in the same section as the claim, never only in a tooltip or on a separate page.
    footer: Footer copyright line reads © 2026 SUPABRAND Mobility SE.
    actionColours: Action red #B72F28 with hover #942720 on web; the Signal brand colour #F04438 is not used for buttons.
  relatedTo: [brand.visual-core]

- id: technical.service-carton-print
  family: context
  kind: note
  domain: technical
  nature: knowledge
  state: defined
  authority: binding
  scope: {channels: [packaging], outputTypes: [service-carton]}
  sourceRefs: ["supabrand:sources/19-packaging-standard.md"]
  value:
    legalTypeMinimum: 7 pt for legal text on service cartons (packaging standard PK-21).
    lockup: Masterbrand lockup on the long side; endorsed-brand mark not larger than the masterbrand mark.
    materials: FSC-certified corrugated board; mono-material inner packaging (synthetic).
  relatedTo: [legal.de-f4-carton-type-size]
